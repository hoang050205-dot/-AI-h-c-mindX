<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainstorm Decision Brief — {{project_name}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #38bdf8;
      --accent-success: #34d399;
      --accent-warning: #fbbf24;
      --accent-danger: #f87171;
      --gradient-card: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 40px; }
    .badge-pill {
      display: inline-block; padding: 6px 16px; border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-primary); font-size: 12px; font-weight: 700; text-transform: uppercase;
    }
    h1 { font-size: 2.2rem; margin: 16px 0; }
    .meta-bar { color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-pill">⚡ AI4A Brainstorm Contract</div>
      <h1>{{project_name}}</h1>
      <div class="meta-bar">Học viên: {{author}} | Mentor: {{mentor}} | Ngày: {{date}}</div>
    </header>
  </div>
</body>
</html>
